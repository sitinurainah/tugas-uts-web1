<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Buku - Toko Buku Ceria</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <h2>Formulir Pemesanan & Pembayaran Buku</h2>
        <a class="back-link" href="dashboard.html" style="display:block;margin-bottom:15px">&larr; Kembali ke Dashboard</a>
        
        <div class="checkout-layout">
        <form id="formCheckout" class="checkout-form">
            <div class="form-group">
                <label>Nama Pemesan</label>
                <input type="text" id="namaPemesan" required placeholder="Nama lengkap Anda">
            </div>
            <div class="form-group">
                <label>Pilih Buku Ajar</label>
                <select id="pilihBuku" required>
                    <option value="">-- Pilih Buku --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Jumlah Pesanan</label>
                <input type="number" id="jmlBuku" min="1" value="1" required>
            </div>
            <div class="form-group">
                <label>Metode Pembayaran</label>
                <select id="metodeBayar" required>
                    <option value="Transfer Bank">Transfer Bank</option>
                    <option value="Virtual Account">Virtual Account</option>
                    <option value="COD">Bayar di Tempat (COD)</option>
                </select>
            </div>
            <button type="submit" class="btn">Proses Pemesanan</button>
        </form>
        <aside class="order-summary">
            <span class="eyebrow-dark">Ringkasan Pesanan</span>
            <h3>Keranjang Buku</h3>
            <div id="checkoutBook">Belum ada buku dipilih</div>
            <div class="summary-row"><span>Jumlah</span><strong id="summaryQty">1</strong></div>
            <div class="summary-row total"><span>Total</span><strong id="summaryTotal">Rp 0</strong></div>
        </aside>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
