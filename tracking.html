<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Pengiriman - Toko Buku Ceria</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <h2>Tracking Pengiriman Modul / Buku</h2>
        <a class="back-link" href="dashboard.html" style="display:block;margin-bottom:15px">&larr; Kembali ke Dashboard</a>
        
        <div class="form-group">
            <label>Nomor Delivery Order (DO) / ID Order</label>
            <div class="tracking-search">
                <input type="text" id="inputDO" placeholder="Contoh: 20230012 atau 20230013">
                <button class="btn" style="width: 130px;" onclick="cariTracking()">Cari DO</button>
            </div>
        </div>

        <div id="hasilTracking" class="tracking-result" style="display:none">
            <h3>Detail & Riwayat Pengiriman</h3>
            <p style="margin-top: 8px;"><strong>Nama Pemesan:</strong> <span id="resPemesan"></span></p>
            <p><strong>Status Pengiriman:</strong> <span id="resStatus" style="color: #27ae60; font-weight: bold;"></span></p>
            <p><strong>Ekspedisi & Paket:</strong> <span id="resEkspedisi"></span></p>
            <p><strong>Tanggal Kirim:</strong> <span id="resTgl"></span></p>
            <p><strong>Total Pembayaran:</strong> <span id="resTotal"></span></p>
            
            <div style="margin-top: 15px;">
                <label style="font-weight: bold; color: var(--primary);">Timeline Perjalanan Paket:</label>
                <div id="resTimeline" class="tracking-timeline"></div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
