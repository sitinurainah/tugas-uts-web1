<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toko Buku Ceria</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container login-shell">
        <aside class="login-brand">
            <img class="brand-logo" src="assets/logo.png" alt="Logo Toko Buku">
            <div class="brand-copy">
                <span class="eyebrow">Ruang Baca</span>
                <h1>Toko Buku Ceria</h1>
                <p>Temukan buku pilihan, cek stok, pesan, dan lacak paket dalam satu tempat.</p>
            </div>
        </aside>
        <div class="login-form">
            <h2>Selamat Datang</h2>
            <p class="subtitle">Masuk untuk mengelola kebutuhan bukumu.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="rina@gmail.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Masuk ke Buku</button>
            </form>
            <div class="links">
                <a href="#" id="btnLupa">Lupa password?</a>
                <a href="#" id="btnDaftar">Daftar akun</a>
            </div>
        </div>
    </div>

    <!-- Modal Lupa Password -->
    <div id="modalLupa" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modalLupa')">&times;</span>
            <h3>Reset Password</h3>
            <p style="margin-top: 10px; font-size: 14px; color: #666;">Masukkan email terdaftar Anda.</p>
            <div class="form-group" style="margin-top: 15px;">
                <input type="email" id="emailReset" placeholder="Email aktif">
            </div>
            <button class="btn" onclick="alert('Instruksi reset telah dikirim.'); closeModal('modalLupa');">Kirim Instruksi</button>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div id="modalDaftar" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modalDaftar')">&times;</span>
            <h3>Daftar Anggota Baru</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label>Nama Lengkap</label>
                <input type="text" id="regNama">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword">
            </div>
            <button class="btn" onclick="alert('Pendaftaran berhasil! Silakan login.'); closeModal('modalDaftar');">Daftar</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
